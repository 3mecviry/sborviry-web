<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O nás | Sbor Víry — Třinec</title>
<meta name="theme-color" content="#FBF8F5">
<link rel="icon" href="assets/img/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about">
<a class="skip" href="#main" data-i18n="ui.skip">Přejít na hlavní obsah</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow" data-i18n="about.hero.eyebrow"></span>
      <h1 data-i18n="about.hero.h1"></h1>
      <p data-i18n="about.hero.p"></p>
    </div>
  </section>

  <!-- ---------------------------- PŘÍBĚH ---------------------------- -->
  <section class="section">
    <div class="wrap">
      <div class="split">
        <div class="stack" data-reveal>
          <span class="eyebrow" data-i18n="about.story.eyebrow"></span>
          <h2 data-i18n="about.story.h2"></h2>
          <p data-i18n="about.story.p1"></p>
          <p data-i18n="about.story.p2"></p>
          <p data-i18n="about.story.p3"></p>
          <p data-i18n="about.story.p4"></p>
        </div>
        <div class="media ratio-4-3" data-photo="assets/img/sbor-1.jpg" data-photo-alt-key="photos.about1" data-reveal></div>
      </div>
    </div>
  </section>

  <!-- ---------------------------- VIZE ---------------------------- -->
  <section class="section section-cream">
    <div class="wrap">
      <div class="split reverse">
        <div class="media ratio-4-3" data-photo="assets/img/sbor-2.jpg" data-photo-alt-key="photos.about2" data-reveal></div>
        <div class="stack" data-reveal>
          <span class="eyebrow" data-i18n="about.vision.eyebrow"></span>
          <h2 data-i18n="about.vision.h2"></h2>
          <p class="lead" data-i18n="about.vision.p1"></p>
          <p data-i18n="about.vision.p2"></p>
          <p data-i18n="about.vision.p3"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ---------------------------- ČEMU VĚŘÍME ---------------------------- -->
  <section class="section">
    <div class="wrap">
      <div class="section-head center" data-reveal>
        <span class="eyebrow" data-i18n="about.believe.eyebrow"></span>
        <h2 data-i18n="about.believe.h2"></h2>
        <p data-i18n="about.believe.p"></p>
      </div>
      <div class="grid g-3">
        <article class="card" data-reveal><span class="card-icon" data-icon="book"></span>
          <h3 data-i18n="about.believe.b1t"></h3><p data-i18n="about.believe.b1d"></p></article>
        <article class="card" data-reveal><span class="card-icon green" data-icon="spark"></span>
          <h3 data-i18n="about.believe.b2t"></h3><p data-i18n="about.believe.b2d"></p></article>
        <article class="card" data-reveal><span class="card-icon" data-icon="heart"></span>
          <h3 data-i18n="about.believe.b3t"></h3><p data-i18n="about.believe.b3d"></p></article>
        <article class="card" data-reveal><span class="card-icon green" data-icon="hands"></span>
          <h3 data-i18n="about.believe.b4t"></h3><p data-i18n="about.believe.b4d"></p></article>
        <article class="card" data-reveal><span class="card-icon" data-icon="spark"></span>
          <h3 data-i18n="about.believe.b5t"></h3><p data-i18n="about.believe.b5d"></p></article>
        <article class="card" data-reveal><span class="card-icon green" data-icon="users"></span>
          <h3 data-i18n="about.believe.b6t"></h3><p data-i18n="about.believe.b6d"></p></article>
        <article class="card" data-reveal><span class="card-icon" data-icon="smile"></span>
          <h3 data-i18n="about.believe.b7t"></h3><p data-i18n="about.believe.b7d"></p></article>
      </div>
    </div>
  </section>

  <!-- ---------------------------- VEDENÍ ---------------------------- -->
  <section class="section section-dark">
    <div class="wrap">
      <div class="split">
        <div data-reveal>
          <span class="eyebrow on-dark" data-i18n="about.lead.eyebrow"></span>
          <h2 class="mt-1" data-i18n="about.lead.h2"></h2>
          <div class="small" style="color:#FF7C74;margin-top:.6rem;font-weight:600"
               data-i18n="about.lead.role"></div>
          <div class="stack mt-2" style="color:#9C948E">
            <p data-i18n="about.lead.b1"></p>
            <p data-i18n="about.lead.b2"></p>
            <p data-i18n="about.lead.b3"></p>
            <p data-i18n="about.lead.b4"></p>
          </div>
          <div class="btn-row mt-2">
            <a class="btn btn-primary" data-page-link="contact" href="#" data-i18n="cta.contact"></a>
          </div>
        </div>
        <div class="media ratio-3-4" data-photo="assets/img/pastor.jpg" data-photo-alt-key="photos.pastor" data-reveal style="max-width:400px;align-self:start"></div>
      </div>
    </div>
  </section>

  <!-- ---------------------------- PRÁVNÍ ÚDAJE ---------------------------- -->
  <section class="section">
    <div class="wrap wrap-narrow">
      <div class="section-head" data-reveal>
        <span class="eyebrow" data-i18n="about.legal.eyebrow"></span>
        <h2 data-i18n="about.legal.h2"></h2>
      </div>
      <div id="contact-info" data-reveal></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="cta-band" data-reveal>
        <h2 data-i18n="home.cta.h2"></h2>
        <p data-i18n="home.cta.p"></p>
        <div class="btn-row">
          <a class="btn btn-primary" data-page-link="first" href="#" data-i18n="cta.first"></a>
          <a class="btn btn-light" data-page-link="sermons" href="#" data-i18n="cta.watch"></a>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
