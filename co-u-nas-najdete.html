<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co u nás najdete | Sbor Víry — Třinec</title>
<meta name="theme-color" content="#FBF8F5">
<link rel="icon" href="assets/img/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="ministries">
<a class="skip" href="#main" data-i18n="ui.skip">Přejít na hlavní obsah</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow" data-i18n="ministries.hero.eyebrow"></span>
      <h1 data-i18n="ministries.hero.h1"></h1>
      <p data-i18n="ministries.hero.p"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid g-3">
        <article class="card" data-reveal><span class="card-icon" data-icon="home"></span>
          <h3 data-i18n="ministries.m1t"></h3><p data-i18n="ministries.m1d"></p></article>
        <article class="card" data-reveal><span class="card-icon green" data-icon="music"></span>
          <h3 data-i18n="ministries.m2t"></h3><p data-i18n="ministries.m2d"></p></article>
        <article class="card" data-reveal><span class="card-icon" data-icon="users"></span>
          <h3 data-i18n="ministries.m3t"></h3><p data-i18n="ministries.m3d"></p></article>
        <article class="card" data-reveal><span class="card-icon green" data-icon="hands"></span>
          <h3 data-i18n="ministries.m4t"></h3><p data-i18n="ministries.m4d"></p></article>
      </div>
    </div>
  </section>

  <section class="section section-cream">
    <div class="wrap">
      <div class="split wide-left">
        <div data-reveal>
          <span class="eyebrow" data-i18n="home.times.eyebrow"></span>
          <h2 class="mt-1" data-i18n="home.times.h2"></h2>
          <p class="lead muted mt-1" data-i18n="home.times.p"></p>
        </div>
        <div data-reveal>
          <div class="times" id="times"></div>
          <p class="small muted mt-1" data-i18n="home.times.note"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="cta-band" data-reveal>
        <h2 data-i18n="ministries.cta.h2"></h2>
        <p data-i18n="ministries.cta.p"></p>
        <div class="btn-row">
          <a class="btn btn-primary" data-page-link="contact" href="#" data-i18n="cta.contact"></a>
          <a class="btn btn-light" data-page-link="give" href="#" data-i18n="cta.support"></a>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
