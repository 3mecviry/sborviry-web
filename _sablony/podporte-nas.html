<!-- BEZPEČNOST: seznam níž určuje, odkud smí stránka načítat obsah — písma
     z Googlu, náhledy z YouTube, mapu z OpenStreetMap. Cokoli jiného prohlížeč
     odmítne, takže i kdyby se do stránky někdy dostal cizí kód, nemá odkud
     stáhnout další ani kam poslat data.

     zablokuje a služba se prostě nezobrazí. -->

     ne konkrétní stránku. -->
