<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- BEZPEČNOST: seznam níž určuje, odkud smí stránka načítat obsah — písma
     z Googlu, náhledy z YouTube, mapu z OpenStreetMap. Cokoli jiného prohlížeč
     odmítne, takže i kdyby se do stránky někdy dostal cizí kód, nemá odkud
     stáhnout další ani kam poslat data.
     Přidáváte-li na web cizí službu (jiné mapy, formulářový server, měření
     návštěvnosti), musíte její adresu dopsat sem — jinak ji prohlížeč
     zablokuje a služba se prostě nezobrazí. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.openstreetmap.org; upgrade-insecure-requests">
<!-- Cizí web se při odchodu dozví jen doménu, ze které návštěvník přišel,
     ne konkrétní stránku. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Délka úryvku ve výsledcích: bez téhle značky si Google volí sám a bývá
     skoupý. Plná délka znamená víc našeho textu ve vyhledávání i v odpovědích AI. -->
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<!-- ÚKLID ADRESY: smaže z odkazu sledovací kódy sociálních sítí a newsletterů,
     aby v adresním řádku zůstalo jen sborviry.org. Viz assets/js/start.js —
     dřív byl tenhle úsek vepsaný v každé stránce zvlášť. -->
<script src="assets/js/start.js"></script>

<body data-page="contact">
<a class="skip" href="#main" data-i18n="ui.skip">Přejít na hlavní obsah</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow" data-i18n="contact.hero.eyebrow"></span>
      <h1 data-i18n="contact.hero.h1"></h1>
      <p data-i18n="contact.hero.p"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split">

        <!-- údaje -->
        <div data-reveal>
          <div id="contact-info"></div>
          <div class="mt-3">
            <h4 class="small" style="letter-spacing:.1em;text-transform:uppercase;color:var(--muted)"
                data-i18n="contact.labels.social"></h4>
            <div class="btn-row mt-1" id="socials"></div>
          </div>
        </div>

        <!-- formulář -->
        <div data-reveal>
          <h2 data-i18n="contact.form.h2"></h2>
          <p class="muted mt-1" data-i18n="contact.form.p"></p>

          <!--
            Formulář ve výchozím stavu otevře e-mailový program návštěvníka.
            Chcete-li e-maily přijímat přímo (bez otevírání klienta), založte si
            zdarma účet na formspree.io a upravte tento <form> takto:
              <form id="contact-form" data-mode="endpoint"
                    action="https://formspree.io/f/VAS_KOD" method="POST">
            POZOR: zároveň musíte v hlavičce VŠECH šablon rozšířit pravidlo CSP
            z „form-action 'self'“ na „form-action 'self' https://formspree.io“
            a spustit generátor — jinak prohlížeč odeslání tiše zablokuje
            a chyba se ukáže jen v konzoli (F12).

            method="post" a action="#" níž jsou pojistka: kdyby JavaScript
            neproběhl, prohlížeč by jinak formulář odeslal metodou GET — a jméno,
            e-mail i text zprávy by skončily v adresním řádku a v přístupových
            záznamech serverů. Takhle se data do adresy nedostanou nikdy.
          -->
          <form id="contact-form" class="mt-2" method="post" action="#">
            <div class="grid" style="grid-template-columns:1fr">
              <div class="grid g-2">
                <div class="field">
                  <label for="f-name" data-i18n="contact.form.name"></label>
                  <input id="f-name" name="name" type="text" required autocomplete="name">
                </div>
                <div class="field">
                  <label for="f-email" data-i18n="contact.form.email"></label>
                  <input id="f-email" name="email" type="email" required autocomplete="email">
                </div>
              </div>
              <div class="grid g-2">
                <div class="field">
                  <label for="f-phone" data-i18n="contact.form.phone"></label>
                  <input id="f-phone" name="phone" type="tel" autocomplete="tel">
                </div>
                <div class="field">
                  <label for="f-subject" data-i18n="contact.form.subject"></label>
                  <select id="f-subject" name="subject"></select>
                </div>
              </div>
              <div class="field">
                <label for="f-message" data-i18n="contact.form.message"></label>
                <textarea id="f-message" name="message" required></textarea>
              </div>
              <label style="display:flex;gap:.65rem;align-items:flex-start;font-size:.9rem;color:var(--muted)">
                <input type="checkbox" required style="margin-top:.3rem;width:auto;flex:none">
                <span data-i18n="contact.form.consent"></span>
              </label>
              <div class="btn-row">
                <button class="btn btn-primary" type="submit" data-i18n="contact.form.send"></button>
              </div>
              <p class="small muted" data-i18n="contact.form.hint"></p>
            </div>
          </form>
        </div>

      </div>
    </div>
  </section>

  <!-- ---------------------------- MAPA ---------------------------- -->
  <section class="section section-cream">
    <div class="wrap">
      <div class="section-head" data-reveal>
        <h2 data-i18n="contact.map.h2"></h2>
        <p data-i18n="contact.map.p"></p>
      </div>
      <div id="map" data-reveal></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="cta-band" data-reveal>
        <h2 data-i18n="home.cta.h2"></h2>
        <p data-i18n="home.cta.p"></p>
        <div class="btn-row">
          <a class="btn btn-primary" data-page-link="first" href="#" data-i18n="cta.first"></a>
          <a class="btn btn-light" data-page-link="sermons" href="#" data-i18n="cta.watch"></a>
        </div>
      </div>
    </div>
  </section>

</main>
