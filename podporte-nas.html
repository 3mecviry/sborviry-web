<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podpořte nás | Sbor Víry — Třinec</title>
<meta name="theme-color" content="#FBF8F5">
<link rel="icon" href="assets/img/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="give">
<a class="skip" href="#main" data-i18n="ui.skip">Přejít na hlavní obsah</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow" data-i18n="give.hero.eyebrow"></span>
      <h1 data-i18n="give.hero.h1"></h1>
      <p data-i18n="give.hero.p"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split">
        <div data-reveal>
          <span class="eyebrow" data-i18n="give.why.eyebrow"></span>
          <h2 class="mt-1" data-i18n="give.why.h2"></h2>
          <ul class="ticks mt-2">
            <li data-i18n="give.why.i1"></li>
            <li data-i18n="give.why.i2"></li>
            <li data-i18n="give.why.i3"></li>
            <li data-i18n="give.why.i4"></li>
            <li data-i18n="give.why.i5"></li>
          </ul>
          <p class="small muted mt-2" data-i18n="give.why.note"></p>
        </div>
        <div data-reveal>
          <span class="eyebrow" data-i18n="give.bank.eyebrow"></span>
          <h2 class="mt-1" data-i18n="give.bank.h2"></h2>
          <div class="mt-2" id="giving"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-cream">
    <div class="wrap wrap-narrow center" data-reveal>
      <h2 data-i18n="give.receipt.h2"></h2>
      <p class="lead muted mt-1" data-i18n="give.receipt.p"></p>
      <div class="btn-row mt-2">
        <a class="btn btn-primary" data-page-link="contact" href="#" data-i18n="cta.contact"></a>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
