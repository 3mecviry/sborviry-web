<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ÚKLID ADRESY: sociální sítě a reklamní systémy připojují k odkazu sledovací
     kódy (fbclid od Facebooku, igsh od Instagramu, utm_… z newsletterů), které
     pak straší v adresním řádku. Tenhle úsek je smaže hned na začátku načítání,
     takže návštěvník vidí jen sborviry.org a název stránky.
     Vlastní parametr ?lang= zůstává — na něm stojí přepínání jazyků.
     Nový sledovací kód se přidá do seznamu níž. -->
<script>
(function () {
  try {
    var adresa = new URL(location.href);
    var parametry = adresa.searchParams;
    var zmeneno = false;
    var smeti = [
      'fbclid', 'igshid', 'igsh',                     // Facebook, Instagram
      'gclid', 'dclid', 'gbraid', 'wbraid', '_ga', '_gl',  // Google
      'msclkid',                                      // Microsoft / Bing
      'ttclid',                                       // TikTok
      'twclid', 'ref_src', 'ref_url',                 // X (Twitter)
      'li_fat_id',                                    // LinkedIn
      'yclid',                                        // Yandex
      'mc_cid', 'mc_eid',                             // Mailchimp
      'si'                                            // YouTube (sdílení)
    ];
    smeti.forEach(function (klic) {
      if (parametry.has(klic)) { parametry.delete(klic); zmeneno = true; }
    });
    Array.from(parametry.keys()).forEach(function (klic) {
      if (klic.indexOf('utm_') === 0) { parametry.delete(klic); zmeneno = true; }
    });
    // Adresy webu jedou bez koncovky .html (sborviry.org/kazani). Kdo přijde
    // po starém odkazu s .html, uvidí čistou adresu — stránka se přitom
    // znovu nenačítá. Mimo ostrou doménu (z disku, z lokálního serveru)
    // koncovka zůstává, tam ji prohlížeč potřebuje.
    var cesta = adresa.pathname;
    if (/(^|\.)sborviry\.org$/.test(location.hostname)) {
      var ciste = cesta.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
      if (ciste !== cesta) { cesta = ciste; zmeneno = true; }
    }
    if (zmeneno) {
      var zbytek = parametry.toString();
      history.replaceState(null, '', cesta + (zbytek ? '?' + zbytek : '') + adresa.hash);
    }
  } catch (e) { /* starý prohlížeč nebo otevřeno přes file:// — adresa zůstane beze změny */ }
})();
</script>

<body data-page="contact">
<a class="skip" href="#main" data-i18n="ui.skip">Přejít na hlavní obsah</a>
<div id="site-header"></div>

<main id="main">

  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow" data-i18n="contact.hero.eyebrow"></span>
      <h1 data-i18n="contact.hero.h1"></h1>
      <p data-i18n="contact.hero.p"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split">

        <!-- údaje -->
        <div data-reveal>
          <div id="contact-info"></div>
          <div class="mt-3">
            <h4 class="small" style="letter-spacing:.1em;text-transform:uppercase;color:var(--muted)"
                data-i18n="contact.labels.social"></h4>
            <div class="btn-row mt-1" id="socials"></div>
          </div>
        </div>

        <!-- formulář -->
        <div data-reveal>
          <h2 data-i18n="contact.form.h2"></h2>
          <p class="muted mt-1" data-i18n="contact.form.p"></p>

          <!--
            Formulář ve výchozím stavu otevře e-mailový program návštěvníka.
            Chcete-li e-maily přijímat přímo (bez otevírání klienta), založte si
            zdarma účet na formspree.io a upravte tento <form> takto:
              <form id="contact-form" data-mode="endpoint"
                    action="https://formspree.io/f/VAS_KOD" method="POST">
          -->
          <form id="contact-form" class="mt-2">
            <div class="grid" style="grid-template-columns:1fr">
              <div class="grid g-2">
                <div class="field">
                  <label for="f-name" data-i18n="contact.form.name"></label>
                  <input id="f-name" name="name" type="text" required autocomplete="name">
                </div>
                <div class="field">
                  <label for="f-email" data-i18n="contact.form.email"></label>
                  <input id="f-email" name="email" type="email" required autocomplete="email">
                </div>
              </div>
              <div class="grid g-2">
                <div class="field">
                  <label for="f-phone" data-i18n="contact.form.phone"></label>
                  <input id="f-phone" name="phone" type="tel" autocomplete="tel">
                </div>
                <div class="field">
                  <label for="f-subject" data-i18n="contact.form.subject"></label>
                  <select id="f-subject" name="subject"></select>
                </div>
              </div>
              <div class="field">
                <label for="f-message" data-i18n="contact.form.message"></label>
                <textarea id="f-message" name="message" required></textarea>
              </div>
              <label style="display:flex;gap:.65rem;align-items:flex-start;font-size:.9rem;color:var(--muted)">
                <input type="checkbox" required style="margin-top:.3rem;width:auto;flex:none">
                <span data-i18n="contact.form.consent"></span>
              </label>
              <div class="btn-row">
                <button class="btn btn-primary" type="submit" data-i18n="contact.form.send"></button>
              </div>
              <p class="small muted" data-i18n="contact.form.hint"></p>
            </div>
          </form>
        </div>

      </div>
    </div>
  </section>

  <!-- ---------------------------- MAPA ---------------------------- -->
  <section class="section section-cream">
    <div class="wrap">
      <div class="section-head" data-reveal>
        <h2 data-i18n="contact.map.h2"></h2>
        <p data-i18n="contact.map.p"></p>
      </div>
      <div id="map" data-reveal></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap">
      <div class="cta-band" data-reveal>
        <h2 data-i18n="home.cta.h2"></h2>
        <p data-i18n="home.cta.p"></p>
        <div class="btn-row">
          <a class="btn btn-primary" data-page-link="first" href="#" data-i18n="cta.first"></a>
          <a class="btn btn-light" data-page-link="sermons" href="#" data-i18n="cta.watch"></a>
        </div>
      </div>
    </div>
  </section>
